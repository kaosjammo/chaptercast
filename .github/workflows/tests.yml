name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      UV_CACHE_DIR: .runtime/uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.29
      - name: Install isolated dependencies
        run: uv sync --locked --extra dev --python '${{ matrix.python-version }}'
      - name: Unit and API tests
        run: uv run --python '${{ matrix.python-version }}' --extra dev pytest -q
