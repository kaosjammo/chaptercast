[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "chaptercast"
version = "0.1.0"
description = "Private local chapter narration application"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "beautifulsoup4>=4.12,<5",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
chaptercast = "chaptercast.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chaptercast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
